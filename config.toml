[config]
ghidra_home = "/opt/ghidra_11.3.2_PUBLIC"
eval_type = "Subset Evaluation"
# eval_type = "Dataset Evaluation"
datasets = ["Loadstar"]
# datasets = ["arm32_coreutils_llvm"]
# datasets = ["arm32_coreutils"]
# datasets = ["mips_coreutils"]
dump_json = true
dump_error_list = true
result_path = "./eval_results"
# evaluator = ["Loadstar"]
evaluator = ["NSDA", "NSDAWoRules"]
# evaluator = ["Ghidra", "NSDA", "ProbNSDA", "Ddisasm"]
# evaluator = ["Ghidra", "NSDA", "ProbNSDA"]
# evaluator = ["Ghidra"]
# evaluator = ["ProbNSDA"]
# evaluator = ["Ghidra", "NSDA"]


log_file = "./nsdaworules.log"
# log_file = "stderr"
log_level = "info"

[dataset.loadstar]
path = "./Datasets/Loadstar"
loader = "LoadstarDataLoader"
subset = ["acos_fbd.app"]
base = 0x0
language = "ARM:LE:32:v5"

[dataset.arm32_coreutils]
path = "./Datasets/coreutils-arm"
loader = "ARMCoreutilsDataLoader"
# subset = ["base64"]
subset = ["readlink"]
base = 0x10000
language = "ARM:LE:32:v5"

[dataset.arm32_coreutils_llvm]
path = "./Datasets/coreutils-arm-llvm"
loader = "ARMCoreutilsDataLoader"
subset = ["tsort"]
base = 0x0
language = "ARM:LE:32:v5"
llvm_arm32 = true

[dataset.mips_coreutils]
path = "./Datasets/coreutils-mips"
loader = "MIPSCoreutilsDataLoader"
subset = ["base64"]
base = 0x400000
language = "MIPS:BE:32:default"

[dataset.mips_coreutils_llvm]
path = "./Datasets/coreutils-mips-llvm"
loader = "MIPSCoreutilsDataLoader"
subset = ["base64"]
base = 0x000000
language = "MIPS:BE:32:default"

[evaluator.nsda]
iteration_limit = 5
epoches_limit = 500
keep_ghidra_prj = true
keep_ghidra_prj_path = "./saved_ghidra_prjs"

[evaluator.nsdaworules]
iteration_limit = 5
epoches_limit = 500
keep_ghidra_prj = true
keep_ghidra_prj_path = "./saved_ghidra_prjs"

[evaluator.probnsda]
iteration_limit = 1
epoches_limit = 2000
keep_ghidra_prj = false
keep_ghidra_prj_path = "./saved_ghidra_prjs"

[evaluator.ghidra]
keep_ghidra_prj = false
keep_ghidra_prj_path = "./saved_ghidra_prjs"
# dump_blocks_path = "./blocks.txt" # Debug use

[evaluator.loadstar]
loadstar_home = "./Datasets/Loadstar"
weights_path = "new_weights.weights.h5"
tokenizer_path = "utils/tokenizer.pkl"
maxlen = 100
batch_size = 128
vocab_size = 651997
embedding_dim = 128
lstm_units = 64

[evaluator.ddisasm]

